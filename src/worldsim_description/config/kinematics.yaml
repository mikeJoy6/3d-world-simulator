# KDL for the 6-DoF ViperX chains base_link -> action_tcp (RViz goal markers, OMPL goals). Streaming end-effector control does
# not use it: KDL, LMA and pick_ik all flip or stall at the wrist singularity (wrist_angle = 0); ee_teleop solves those
# Cartesian steps with the damped IK of worldsim_core and lets MoveIt check them (arm.ik = core).
arm0:
  kinematics_solver: kdl_kinematics_plugin/KDLKinematicsPlugin
  kinematics_solver_search_resolution: 0.005
  kinematics_solver_timeout: 0.05
arm1:
  kinematics_solver: kdl_kinematics_plugin/KDLKinematicsPlugin
  kinematics_solver_search_resolution: 0.005
  kinematics_solver_timeout: 0.05
